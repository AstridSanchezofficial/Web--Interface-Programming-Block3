<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Current Weather Web Component</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <main class="container py-5">

        <header class="text-center mb-5">
            <h1 class="display-4 fw-bold">
                Current Weather
            </h1>

            <p class="lead">
                A reusable Web Component that displays the current temperature
                based on the user's location.
            </p>
        </header>

        <section class="row justify-content-center">

            <div class="col-md-6">

                <!-- Component using user's location -->
                <current-weather></current-weather>

            </div>

        </section>

    </main>

    <!-- JavaScript files -->
    <script type="module" src="js/current-weather.js"></script>

</body>
</html>
