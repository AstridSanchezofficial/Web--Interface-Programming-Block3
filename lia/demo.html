<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Component Demo</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/styles.css">

</head>

<body>

    <main class="container py-5">

        <h1 class="text-center mb-5">
            Weather Component
        </h1>

        <div class="row g-4">

            <!-- Automatic location -->
            <div class="col-md-6">

                <h2 class="h4 mb-3">
                    My Current Location
                </h2>

                <current-weather></current-weather>

            </div>


            <!-- Manual coordinates -->
            <div class="col-md-6">

                <h2 class="h4 mb-3">
                    Montreal Weather
                </h2>

                <current-weather
                    latitude="45.5088"
                    longitude="-73.5878">
                </current-weather>

            </div>

        </div>

    </main>

    <script type="module" src="js/current-weather.js"></script>

</body>

</html>
